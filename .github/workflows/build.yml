name: Build Saha Kids Test APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build the app
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk SahaKidsTest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SahaKidsTest
          path: SahaKidsTest.apk

      - name: Publish a download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Saha Kids Test 1.0.${{ github.run_number }}
          body: |
            Download **SahaKidsTest.apk** below and open it on the Android tablet to install or update.
            Your children's scores and your own questions are kept when you update.
          files: SahaKidsTest.apk
          make_latest: true
